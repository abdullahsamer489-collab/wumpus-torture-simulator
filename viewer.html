<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wumpus model viewer</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --ink: #1b1d3a; --glass: rgba(255,255,255,.72); --line: rgba(80,86,170,.22); --accent: #6f7bf0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.3 system-ui, "Segoe UI", sans-serif; color: var(--ink); }
    body { background: radial-gradient(120% 90% at 50% 35%, #eef0ff 0%, #d5d9fb 55%, #b8bff0 100%); }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; top: 14px; left: 14px; width: 250px; padding: 12px 12px 10px;
      background: var(--glass); backdrop-filter: blur(8px); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: 0 6px 24px rgba(60,66,150,.15);
    }
    #hud h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; opacity: .7; }
    #hud section { margin-bottom: 9px; }
    #hud h2 { margin: 0 0 4px; font-size: 11px; font-weight: 600; opacity: .55; text-transform: uppercase; letter-spacing: .06em; }
    .row { display: flex; flex-wrap: wrap; gap: 4px; }
    button {
      font: inherit; color: inherit; cursor: pointer; padding: 4px 9px; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(255,255,255,.75);
    }
    button:hover { background: #fff; }
    select { font: inherit; padding: 3px 6px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.8); }
    input[type=range] { width: 90px; }
    button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    body.nohud #hud { display: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>Wumpus</h1>
    <section><h2>Expression</h2><div class="row" id="exprs"></div></section>
    <section><h2>Pose</h2><div class="row" id="poses"></div></section>
    <section><h2>View</h2><div class="row" id="views"></div></section>
    <section><h2>Anatomy</h2><div class="row"><button id="bones">bones</button><button id="organs">organs</button><button id="stumps">stumps</button><button id="squish">squish</button></div></section>
    <section><h2>Melt</h2>
      <div class="row"><select id="meltSeg"></select><input id="melt" type="range" min="0" max="1" step="0.01" value="0"><span id="meltVal">0.00</span></div>
    </section>
    <section><div class="row"><button id="turn">Turntable</button></div></section>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/viewer.js"></script>
</body>
</html>
